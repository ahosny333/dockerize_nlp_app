version: '3.8'

services:
  db:
    image: postgres:15
    container_name: postgres_container
    restart: always
    #env_file: 
      #- .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  flask_app:
    build: .
    image: ${IMAGE_NAME:-default-image}:${BUILD_TAG:-latest}
    restart: always
    depends_on:
      - db
    ports:
      - "5000:5000"
    env_file:
      - .env

volumes:
  pgdata:

